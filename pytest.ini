[pytest]
# Pytest configuration for token_agents project

# Register custom markers
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (real services, isolated components)
    e2e: End-to-end tests (full system)
    slow: Slow tests (> 30 seconds)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Timeout for tests (seconds)
timeout = 300

# Asyncio mode
asyncio_mode = auto
